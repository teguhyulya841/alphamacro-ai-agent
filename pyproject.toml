[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphamacro-crypto"
dynamic = ["version"]
description = "Verifiable AI macro & crypto research: CLI, Telegram bot and REST API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["crypto", "macroeconomics", "langchain", "gemini", "telegram-bot", "ai-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "langchain>=1.0",
    "langchain-google-genai",
    "langchain-tavily",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pyTelegramBotAPI>=4.14",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "mypy",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "ruff",
    "types-requests",
    "uvicorn>=0.27",
]

[project.scripts]
alphamacro = "alphamacro.cli:main"
alphamacro-bot = "alphamacro.telegram_bot.bot:main"
alphamacro-api = "alphamacro.api.server:main"
alphamacro-audit = "alphamacro.audit:main"
alphamacro-keygen = "alphamacro.api.auth:keygen_main"

[tool.setuptools.dynamic]
version = { attr = "alphamacro.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alphamacro = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith.*",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true